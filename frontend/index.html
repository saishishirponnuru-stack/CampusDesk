<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#172554" />
    <script>
      (function () {
        var theme = "system";
        try {
          theme = localStorage.getItem("campusdesk-theme") || "system";
        } catch (_) {}
        if (!["light", "dark", "system"].includes(theme)) theme = "system";
        var resolved =
          theme === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : theme;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="CampusDesk Nova — a considered workspace for academic administration."
    />
    <title>CampusDesk · Academic administration</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry.jsx"></script>
  </body>
</html>
